<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">TopIsland</title>
  <desc id="desc">A compact top surface for Windows.</desc>
  <rect width="1400" height="360" rx="36" fill="#111216"/>

  <g transform="translate(92 78)">
    <rect width="204" height="204" rx="52" fill="#1b1c21"/>
    <rect x="30" y="73" width="144" height="58" rx="29" fill="#000"/>
    <circle cx="148" cy="102" r="7" fill="#f5f5f7"/>
  </g>

  <g transform="translate(358 89)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="0" y="76" fill="#f5f5f7" font-size="68" font-weight="700" letter-spacing="-2">TopIsland</text>
    <text x="2" y="121" fill="#a1a1a6" font-size="24">A compact top surface for Windows.</text>
    <text x="2" y="178" fill="#f5f5f7" font-size="18" font-weight="600">Dynamic Island  ·  inverse-radius Notch  ·  media  ·  system status</text>
    <text x="2" y="216" fill="#6e6e73" font-size="16">Black by default. One surface. Contextual density.</text>
  </g>
